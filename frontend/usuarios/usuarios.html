<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema PQRS - Gestión de Usuarios</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../estilos.css">
</head>
<body>
    <aside class="sidebar">
        <div class="logo">
            <i class="bi bi-building"></i>
            Sistema PQRS
        </div>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a href="/panel" class="nav-link"><i class="bi bi-house-door"></i>Inicio</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link"><i class="bi bi-inbox"></i>PQRS</a>
            </li>
            <li class="nav-item">
                <a href="/solicitudes" class="nav-link "><i class="bi bi-file-earmark-text"></i>Solicitudes</a>
            </li>
            <li class="nav-item">
                <a href="/usuarios" class="nav-link active"><i class="bi bi-people"></i>Usuarios</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link"><i class="bi bi-bar-chart"></i>Reportes</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link"><i class="bi bi-gear"></i>Configuración</a>
            </li>
            <hr class="text-secondary">
            <li class="nav-item">
                <a href="/" class="nav-link text-danger"><i class="bi bi-box-arrow-right"></i>Cerrar sesión</a>
            </li>
        </ul>
    </aside>
    <main class="content">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1>Listado de usuarios</h1>
                <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#staticBackdrop"><i class="bi bi-plus-circle me-2"></i>Crear Nuevo Usuario</button>
            </div>
            
            <div id="alerta-mensaje"></div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre</th>
                                    <th>Apellido</th>
                                    <th>Correo</th>
                                    <th>Contraseña</th>
                                    <th>Rol</th>
                                    <th class="text-end">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-usuarios">
                                <tr><td colspan="7" class="text-center py-4">Cargando usuarios...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

   
   
    <!-- Modal Crear Usuario -->
    <div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="staticBackdropLabel">Crear usuario</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="alerta-modal-crear"></div>
                <form id="formCrearUsuario" onsubmit="event.preventDefault(); crearUsuario();">
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="nombre" placeholder="Ingrese nombre" required minlength="2">
                    </div>
                    <div class="mb-3">
                        <label for="apellido" class="form-label">Apellido <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="apellido" placeholder="Ingrese apellido" required minlength="2">
                    </div>
                    <div class="mb-3">
                        <label for="correo" class="form-label">Correo electrónico <span class="text-danger">*</span></label>
                        <input type="email" class="form-control" id="correo" placeholder="ejemplo@correo.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="contrasenia" class="form-label">Contraseña <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="contrasenia" placeholder="Mínimo 4 caracteres" required minlength="4">
                    </div>
                    <div class="mb-3">
                        <label for="rol" class="form-label">Rol <span class="text-danger">*</span></label>
                        <select class="form-select" id="rol" required>
                            <option value="Usuario">Usuario</option>
                            <option value="Administrador">Administrador</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" id="btnCrearUsuario" onclick="crearUsuario()"><i class="bi bi-person-plus me-1"></i>Crear usuario</button>
            </div>
            </div>
        </div>
    </div>
    
    <!-- Modal Actualizar Usuario -->
    <div class="modal fade" id="modalActualizarUsuario" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="modalActualizarUsuarioLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="modalActualizarUsuarioLabel">Actualizar usuario</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div id="alerta-modal-actualizar"></div>
                <form id="formActualizarUsuario" onsubmit="event.preventDefault(); actualizarUsuario();">
                    <input id="idActualizar" hidden>
                    <div class="mb-3">
                        <label for="nombreActualizar" class="form-label">Nombre <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="nombreActualizar" placeholder="Ingrese nombre" required minlength="2">
                    </div>
                    <div class="mb-3">
                        <label for="apellidoActualizar" class="form-label">Apellido <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="apellidoActualizar" placeholder="Ingrese apellido" required minlength="2">
                    </div>
                    <div class="mb-3">
                        <label for="correoActualizar" class="form-label">Correo electrónico <span class="text-danger">*</span></label>
                        <input type="email" class="form-control" id="correoActualizar" placeholder="ejemplo@correo.com" required>
                    </div>
                    <div class="mb-3">
                        <label for="contraseniaActualizar" class="form-label">Contraseña <span class="text-danger">*</span></label>
                        <input type="password" class="form-control" id="contraseniaActualizar" placeholder="Nueva contraseña" required minlength="4">
                    </div>
                    <div class="mb-3">
                        <label for="rolActualizar" class="form-label">Rol <span class="text-danger">*</span></label>
                        <select class="form-select" id="rolActualizar" required>
                            <option value="Usuario">Usuario</option>
                            <option value="Administrador">Administrador</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" id="btnActualizar" onclick="actualizarUsuario()"><i class="bi bi-check-lg me-1"></i>Actualizar</button>
            </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="usuarios.js"></script>
</body>
</html>

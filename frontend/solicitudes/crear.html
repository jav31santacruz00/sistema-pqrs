<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema PQRS - Crear Solicitud</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../estilos.css">
</head>
<body>
    <aside class="sidebar">
        <div class="logo">
            <i class="bi bi-building"></i>
            Sistema PQRS
        </div>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a href="/panel" class="nav-link"><i class="bi bi-house-door"></i>Inicio</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link"><i class="bi bi-inbox"></i>PQRS</a>
            </li>
            <li class="nav-item">
                <a href="/solicitudes" class="nav-link active"><i class="bi bi-file-earmark-text"></i>Solicitudes</a>
            </li>
            <li class="nav-item">
                <a href="/usuarios" class="nav-link"><i class="bi bi-people"></i>Usuarios</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link"><i class="bi bi-bar-chart"></i>Reportes</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link"><i class="bi bi-gear"></i>Configuración</a>
            </li>
            <hr class="text-secondary">
            <li class="nav-item">
                <a href="/" class="nav-link text-danger"><i class="bi bi-box-arrow-right"></i>Cerrar sesión</a>
            </li>
        </ul>
    </aside>
    <main class="content">
        <div class="container-fluid">
            <div class="d-flex align-items-center mb-4">
                <a href="/solicitudes" class="btn btn-outline-secondary me-3"><i class="bi bi-arrow-left"></i> Volver</a>
                <h1 class="mb-0">Crear Nueva Solicitud (PQRSF)</h1>
            </div>
            
            <div id="alerta-mensaje"></div>

            <div class="card shadow-sm border-0">
                <div class="card-body">
                    <form id="formulario-crear">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="tipo" class="form-label">Tipo de Solicitud</label>
                                <select class="form-select" id="tipo" required>
                                    <option value="" selected disabled>Seleccione el tipo...</option>
                                    <option value="Petición">Petición</option>
                                    <option value="Queja">Queja</option>
                                    <option value="Reclamo">Reclamo</option>
                                    <option value="Sugerencia">Sugerencia</option>
                                    <option value="Felicitación">Felicitación</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="asunto" class="form-label">Asunto</label>
                                <input type="text" class="form-control" id="asunto" placeholder="Breve resumen de la solicitud" required>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="nombre" class="form-label">Nombre Completo</label>
                                <input type="text" class="form-control" id="nombre" placeholder="Juan Pérez" required>
                            </div>
                            <div class="col-md-6">
                                <label for="correo" class="form-label">Correo Electrónico</label>
                                <input type="email" class="form-control" id="correo" placeholder="correo@ejemplo.com" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="descripcion" class="form-label">Descripción Detallada</label>
                            <textarea class="form-control" id="descripcion" rows="5" placeholder="Detalle aquí su petición, queja, reclamo, sugerencia o felicitación..." required></textarea>
                        </div>

                        <div class="d-flex justify-content-end">
                            <button type="button" class="btn btn-secondary me-2" onclick="window.location.href='/solicitudes'">Cancelar</button>
                            <button type="submit" class="btn btn-primary"><i class="bi bi-send me-2"></i>Enviar Solicitud</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="crear.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema PQRS - Solicitudes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../estilos.css">
</head>
<body>
    <aside class="sidebar">
        <div class="logo">
            <i class="bi bi-building"></i>
            Sistema PQRS
        </div>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a href="/panel" class="nav-link"><i class="bi bi-house-door"></i>Inicio</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link"><i class="bi bi-inbox"></i>PQRS</a>
            </li>
            <li class="nav-item">
                <a href="/solicitudes" class="nav-link active"><i class="bi bi-file-earmark-text"></i>Solicitudes</a>
            </li>
            <li class="nav-item">
                <a href="/usuarios" class="nav-link"><i class="bi bi-people"></i>Usuarios</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link"><i class="bi bi-bar-chart"></i>Reportes</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link"><i class="bi bi-gear"></i>Configuración</a>
            </li>
            <hr class="text-secondary">
            <li class="nav-item">
                <a href="/" class="nav-link text-danger"><i class="bi bi-box-arrow-right"></i>Cerrar sesión</a>
            </li>
        </ul>
    </aside>
    <main class="content">
        <div class="container-fluid">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1>Listado de Solicitudes</h1>
                <a href="/solicitudes/crear" class="btn btn-primary"><i class="bi bi-plus-circle me-2"></i>Crear Nueva Solicitud</a>
            </div>
            
            <div id="alerta-mensaje"></div>

            <div class="card shadow-sm border-0">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th>ID</th>
                                    <th>Tipo</th>
                                    <th>Asunto</th>
                                    <th>Nombre</th>
                                    <th>Estado</th>
                                    <th>Fecha</th>
                                    <th class="text-end">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-solicitudes">
                                <tr><td colspan="7" class="text-center py-4">Cargando solicitudes...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="solicitudes.js"></script>
</body>
</html>

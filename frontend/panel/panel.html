<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema PQRS</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../estilos.css">
</head>
<body>
    <aside class="sidebar">
        <div class="logo">
            <i class="bi bi-building"></i>
            Sistema PQRS
        </div>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a href="#" class="nav-link active"><i class="bi bi-house-door"></i>Inicio</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link"><i class="bi bi-inbox"></i>PQRS</a>
            </li>
            <li class="nav-item">
                <a href="/solicitudes" class="nav-link"><i class="bi bi-file-earmark-text"></i>Solicitudes</a>
            </li>
            <li class="nav-item">
                <a href="/usuarios" class="nav-link"><i class="bi bi-people"></i>Usuarios</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link"><i class="bi bi-bar-chart"></i>Reportes</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link"><i class="bi bi-gear"></i>Configuración</a>
            </li>
            <hr class="text-secondary">
            <li class="nav-item">
                <a href="#" class="nav-link text-danger"><i class="bi bi-box-arrow-right"></i>Cerrar sesión</a>
            </li>
        </ul>
    </aside>
    <main class="content">
        <div class="container-fluid">
            <h1 class="mb-4">Panel principal</h1>
            <div class="row g-4">
                <div class="col-md-4">
                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <h5 class="card-title">
                            <i class="bi bi-inbox text-primary"></i>PQRS recibidas</h5>
                            <h2 class="mt-3">125</h2>
                            <p class="text-muted">Solicitudes registradas</p>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <h5 class="card-title">
                                <i class="bi bi-clock text-warning"></i>
                                Pendientes
                            </h5>

                            <h2 class="mt-3">32</h2>

                            <p class="text-muted">
                                Solicitudes pendientes
                            </p>
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="card shadow-sm border-0">
                        <div class="card-body">
                            <h5 class="card-title">
                                <i class="bi bi-check-circle text-success"></i>
                                Resueltas
                            </h5>

                            <h2 class="mt-3">93</h2>
                            <p class="text-muted">Solicitudes solucionadas</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
